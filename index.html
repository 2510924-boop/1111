<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우리반 전서구 편지함 🕊️</title>
  <!-- Google Fonts: Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- QRCode CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans KR', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Styling scrollbars inside panels */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.35);
    }

    /* Gently floating levitation for letter cards */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    .letter-card-inner {
      animation: float 3.5s ease-in-out infinite;
    }

    /* Fast entrance spring zoom */
    @keyframes cardIn {
      from {
        transform: scale(0.85) translateY(12px);
        opacity: 0;
      }
      to {
        transform: scale(1) translateY(0);
        opacity: 1;
      }
    }
    .letter-card-outer {
      animation: cardIn 0.5s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    /* List rows entrance */
    @keyframes fadeSlideIn {
      from {
        transform: translateY(8px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    .sidebar-item-anim {
      animation: fadeSlideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-[#87CEEB] to-[#B0E2FF] h-screen overflow-hidden flex font-sans select-none relative text-slate-800">

  <!-- Canvas for Drifting Day Clouds Background -->
  <canvas id="starfield" class="fixed inset-0 z-0 pointer-events-none"></canvas>

  <!-- Left Sidebar Panel (White Glassmorphism) -->
  <aside class="w-[200px] shrink-0 bg-white/40 border-r border-white/50 backdrop-blur-md h-full flex flex-col z-10 relative">
    <!-- Header Title -->
    <div class="p-4 border-b border-white/40 flex items-center gap-2">
      <span class="text-xl">🕊️</span>
      <h2 class="text-xs font-bold tracking-tight text-sky-950 uppercase">오늘의 편지</h2>
    </div>
    
    <!-- Sidebar items list container -->
    <div id="sidebar-list" class="flex-1 overflow-y-auto p-3 space-y-2.5">
      <!-- Appended programmatically -->
    </div>

    <!-- Sidebar Footer Navigation -->
    <div class="p-3 border-t border-white/40 bg-white/20 flex flex-col gap-1.5 shrink-0 select-none">
      <a href="letter.html" class="flex items-center justify-between px-3 py-2.5 bg-gradient-to-r from-sky-500 to-blue-600 hover:opacity-95 text-xs font-semibold text-white rounded-xl shadow transition-all active:scale-95 text-center">
        <span>🕊️ 편지 보내기</span>
        <span class="text-xs">➔</span>
      </a>
      <a href="admin.html" class="flex items-center justify-center gap-1.5 px-3 py-2 hover:bg-white/30 text-[11px] font-bold text-sky-950 rounded-xl transition-all">
        <span>📋 교실 관리자 페이지</span>
      </a>
    </div>
  </aside>

  <!-- Main Billboard Screen -->
  <main id="main-area" class="flex-1 h-full relative z-10 overflow-hidden">
    <!-- Card Spawning Arena -->
    <div id="cards-container" class="w-full h-full relative p-6"></div>
  </main>

  <!-- Flapping carrier pigeon SVG (delivers letters horizontally) -->
  <svg id="envelope" width="90" height="70" viewBox="0 0 80 62" style="position: absolute; pointer-events: none; z-index: 50; display: none;">
    <defs>
      <filter id="env-shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.35"/>
      </filter>
    </defs>
    <g filter="url(#env-shadow)">
      <!-- Flapping Wings -->
      <path id="wl" d="M35,28 C25,12 18,22 35,28 Z" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" transform-origin="35 28" />
      <path id="wr" d="M45,28 C55,12 62,22 45,28 Z" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" transform-origin="45 28" />

      <!-- Bird main body -->
      <path d="M30,38 C32,28 48,25 54,34 C58,40 50,46 45,46 C38,46 32,44 30,38 Z" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
      
      <!-- Beak with tiny heart envelope -->
      <polygon points="54,34 59,32 55,38" fill="#f59e0b" stroke="#f59e0b" />
      
      <!-- Eye -->
      <circle cx="48" cy="32" r="1.5" fill="#2563eb" />

      <!-- Glowing letter in claws -->
      <g transform="translate(35, 42)">
        <rect x="0" y="0" width="14" height="10" rx="1.5" fill="#fff" stroke="#2563eb" stroke-width="1.5" />
        <polyline points="0,0 7,5 14,0" stroke="#2563eb" stroke-width="1" fill="none" />
        <text x="4" y="8" font-size="6" fill="red">❤️</text>
      </g>
    </g>
  </svg>

  <!-- Fixed Elements on Top/Bottom Corners -->
  <!-- 1. Beautiful QR Code Panel (Upper Right) -->
  <div class="fixed right-4 top-4 bg-white/70 backdrop-blur-[12px] border border-white/60 p-3 rounded-[24px] shadow-xl flex flex-col items-center gap-2 z-20">
    <div id="qrcode-container" class="bg-white p-2 rounded-[14px] shadow-inner flex items-center justify-center relative">
      <!-- QRCode canvas standard anchor -->
    </div>
    <span class="text-[10px] font-bold text-sky-950 tracking-wide bg-sky-500/10 border border-sky-500/20 px-2.5 py-1 rounded-full">편지 쓰기 🕊️</span>
  </div>

  <!-- 2. Interactive Notification Toast (Bottom Center) -->
  <div id="notify-bar" class="fixed bottom-5 left-[220px] right-[110px] bg-white/95 border border-sky-200/50 backdrop-blur-md px-6 py-4 rounded-2xl shadow-xl shadow-sky-950/10 text-sm font-bold tracking-wide flex items-center gap-3 transition-all duration-300 transform translate-y-12 opacity-0 z-20 text-slate-800">
    <div class="flex items-center justify-center w-8 h-8 bg-sky-100 rounded-xl">🕊️</div>
    <span id="notify-text">새 편지가 도착했어요!</span>
  </div>

  <!-- 3. Dynamic Total Count Badge (Bottom Right) -->
  <div class="fixed right-4 bottom-5 bg-sky-500/90 backdrop-blur-[12px] border border-white/40 px-4 py-3 rounded-2xl shadow-lg text-xs font-bold tracking-wide flex items-center gap-2 z-20 text-white">
    <span>총 편지 수</span>
    <span id="total-badge" class="bg-white text-sky-950 px-2.5 py-0.5 rounded-lg text-sm transition-all duration-300">0</span>
  </div>

  <!-- Firebase Integration via CDN Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, query, orderByChild, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // Firebase configuration with provided keys
    const firebaseConfig = {
      apiKey: "AIzaSyCyfVIDGGqqpqO08mJ7dMsCsBYG2DWhd14",
      authDomain: "letter23-20f00.firebaseapp.com",
      databaseURL: "https://letter23-20f00-default-rtdb.firebaseio.com",
      projectId: "letter23-20f00",
      storageBucket: "letter23-20f00.firebasestorage.app",
      messagingSenderId: "280106321366",
      appId: "1:280106321366:web:6f23c4e8913ee683d25077",
      measurementId: "G-205J0TH5ZG"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // DOM Elements
    const starCanvas = document.getElementById('starfield');
    const starCtx = starCanvas.getContext('2d');
    const sidebarList = document.getElementById('sidebar-list');
    const cardsContainer = document.getElementById('cards-container');
    const totalBadge = document.getElementById('total-badge');
    const notifyBar = document.getElementById('notify-bar');
    const notifyText = document.getElementById('notify-text');
    const mainArea = document.getElementById('main-area');

    // 1. SKY & CLOUDS CANVAS RENDERING ENGINE
    let windowWidth = window.innerWidth;
    let windowHeight = window.innerHeight;
    const resizeCanvas = () => {
      windowWidth = window.innerWidth;
      windowHeight = window.innerHeight;
      starCanvas.width = windowWidth;
      starCanvas.height = windowHeight;
    };
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Create 15 fluffy cloud clusters on canvas
    const clouds = [];
    for (let i = 0; i < 15; i++) {
      clouds.push({
        x: Math.random() * windowWidth,
        y: Math.random() * windowHeight * 0.7,
        r: Math.random() * 40 + 30, // base size radius
        speed: Math.random() * 0.15 + 0.05,
        opacity: Math.random() * 0.25 + 0.12
      });
    }

    // Glistening sparkles in the sky (8 elements)
    const sparkles = [];
    for (let i = 0; i < 8; i++) {
      sparkles.push({
        x: Math.random(),
        y: Math.random(),
        size: Math.random() * 3 + 2,
        speed: Math.random() * 0.01 + 0.005,
        phase: Math.random() * Math.PI * 2
      });
    }

    const renderSky = () => {
      starCtx.clearRect(0, 0, windowWidth, windowHeight);

      // Render fluffy clouds
      clouds.forEach(c => {
        // Increment horizontal position
        c.x += c.speed;
        if (c.x - c.r * 2 > windowWidth) {
          c.x = -c.r * 2;
          c.y = Math.random() * windowHeight * 0.7;
        }

        // Draw soft, stacked circles for cloud realism
        starCtx.fillStyle = `rgba(255, 255, 255, ${c.opacity})`;
        starCtx.beginPath();
        starCtx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
        starCtx.arc(c.x + c.r * 0.6, c.y - c.r * 0.2, c.r * 0.8, 0, Math.PI * 2);
        starCtx.arc(c.x + c.r * 1.1, c.y + c.r * 0.1, c.r * 0.7, 0, Math.PI * 2);
        starCtx.arc(c.x - c.r * 0.5, c.y + c.r * 0.15, c.r * 0.6, 0, Math.PI * 2);
        starCtx.fill();
      });

      // Render sparkles
      sparkles.forEach(s => {
        s.phase += s.speed;
        const brightness = (Math.sin(s.phase) + 1) / 2;
        const cx = s.x * windowWidth;
        const cy = s.y * windowHeight;

        starCtx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
        starCtx.beginPath();
        // small twinkling diamonds
        starCtx.moveTo(cx, cy - s.size);
        starCtx.lineTo(cx + s.size, cy);
        starCtx.lineTo(cx, cy + s.size);
        starCtx.lineTo(cx - s.size, cy);
        starCtx.closePath();
        starCtx.fill();
      });

      requestAnimationFrame(renderSky);
    };
    renderSky();

    // 2. CARRIER PIGEON SVG HORIZONTAL FLIGHT PATH
    const env = document.getElementById('envelope');
    let flapAngle = 0;
    let flapDirection = 1;
    let flapAnimId = null;

    const animateFlaps = () => {
      flapAngle += flapDirection * 4;
      if (flapAngle > 35) {
        flapAngle = 35;
        flapDirection = -1;
      } else if (flapAngle < -15) {
        flapAngle = -15;
        flapDirection = 1;
      }

      const wl = document.getElementById('wl');
      const wr = document.getElementById('wr');
      if (wl && wr) {
        wl.setAttribute('transform', `rotate(${flapAngle}, 35, 28)`);
        wr.setAttribute('transform', `rotate(${-flapAngle}, 45, 28)`);
      }
      flapAnimId = requestAnimationFrame(animateFlaps);
    };

    const flyEnvelope = (onLandCallback) => {
      if (flapAnimId) {
        cancelAnimationFrame(flapAnimId);
      }

      env.style.display = 'block';
      env.style.transition = 'none';
      env.style.left = '-120px';
      env.style.top = '48%';
      env.style.opacity = '0';
      env.style.transform = 'rotate(0deg) scale(0.95)';

      flapAngle = 0;
      flapDirection = 1;
      animateFlaps();

      // Stage ①: 80ms later (Pigeon speeds in, flying up)
      setTimeout(() => {
        env.style.transition = 'left 0.7s cubic-bezier(.22,.61,.36,1), top 0.7s cubic-bezier(.22,.61,.36,1), transform 0.7s cubic-bezier(.22,.61,.36,1), opacity 0.7s cubic-bezier(.22,.61,.36,1)';
        env.style.opacity = '1';
        env.style.left = '20%';
        env.style.top = '40%';
        env.style.transform = 'rotate(5deg) scale(1.1)';
      }, 80);

      // Stage ②: 800ms later (Pigeon glides dynamically closer)
      setTimeout(() => {
        env.style.transition = 'left 0.6s cubic-bezier(.22,.61,.36,1), top 0.6s cubic-bezier(.22,.61,.36,1), transform 0.6s cubic-bezier(.22,.61,.36,1)';
        env.style.left = '40%';
        env.style.top = '48%';
        env.style.transform = 'rotate(-3deg) scale(1)';
      }, 800);

      // Stage ③: 1400ms later (Pigeon releases envelope, climbs up and flies away)
      setTimeout(() => {
        env.style.transition = 'left 0.5s ease-out, top 0.5s ease-out, transform 0.5s ease-out, opacity 0.5s ease-out';
        env.style.left = '52%';
        env.style.top = '35%';
        env.style.opacity = '0';
        env.style.transform = 'scale(0.85) rotate(-8deg)';
      }, 1400);

      // Stage ④: 1900ms later (Flanding trigger & Clean loop)
      setTimeout(() => {
        cancelAnimationFrame(flapAnimId);
        env.style.display = 'none';
        if (onLandCallback) onLandCallback();
      }, 1900);
    };

    // 3. TOAST NOTIFICATION CONTROL SYSTEM
    let toastTimeout = null;
    const showNotification = (senderName) => {
      if (toastTimeout) {
        clearTimeout(toastTimeout);
      }
      notifyText.innerText = `🕊️ 전서구가 새 편지를 안고 날아왔어요! — [${senderName}]`;
      
      notifyBar.classList.remove('translate-y-12', 'opacity-0');
      notifyBar.classList.add('translate-y-0', 'opacity-100');

      toastTimeout = setTimeout(() => {
        notifyBar.classList.remove('translate-y-0', 'opacity-100');
        notifyBar.classList.add('translate-y-12', 'opacity-0');
      }, 2800);
    };

    // 4. GENERATE QR CODE WITH LETTER TARGET LINK
    const generateQRCode = () => {
      const base = window.location.href.split('?')[0].split('#')[0];
      const targetUrl = base.replace('index.html', '') + 'letter.html';
      
      const qrBox = document.getElementById('qrcode-container');
      qrBox.innerHTML = ''; // Wipe placeholder
      
      // Create sub-container for the QR code so overlays work flawlessly
      const qrElement = document.createElement('div');
      qrBox.appendChild(qrElement);

      new QRCode(qrElement, {
        text: targetUrl,
        width: 120,
        height: 120,
        colorDark: "#000000", // Chrome default black
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });

      // Chrome Dino Logo overlay
      const dinoOverlay = document.createElement('div');
      dinoOverlay.className = "absolute w-[24px] h-[24px] bg-white rounded flex items-center justify-center shadow-md select-none pointer-events-none";
      dinoOverlay.style.top = "calc(50% - 12px)";
      dinoOverlay.style.left = "calc(50% - 12px)";
      dinoOverlay.innerHTML = `
        <svg viewBox="0 0 24 24" class="w-[18px] h-[18px] text-black" fill="currentColor">
          <path d="M19 3h-8v2h8V3zm1 2h-1v2h1V5zm1 2h-1v6h1V7zm-1 6h-1v1h1v-1zm-1 1h-2v1h2v-1zm-2 1h-2v1h2v-1zm-2 1h-1v4h1v-4zm-1 4h-1v2h1v-2zm-1-6h-1v2h1v-2zm-1-2h-1v2h1v-2zm-1-2h-1v2h1V9zm-1-2H7v2h2V7zm-2 2H5v2h2V9zm-2 2H3v6h2v-6zm0 6H3v2h2v-2zm2 2H5v1h2v-1zm2 1H7v1h2v-1zm5 0h-1v2h1v-2zm3 0h-1v2h1v-2zm-5 2h-1v1h1v-1zm3 0h-1v1h1v-1z"/>
        </svg>
      `;
      qrBox.appendChild(dinoOverlay);
    };
    generateQRCode();

    // 5. SIX PASTEL PAPER ROTATING CARD SCHEMES
    const getCardThemeClass = (index) => {
      const option = index % 6;
      switch (option) {
        case 0: // 핑크 (Soft Pink)
          return {
            bg: "bg-[#FFD6E7]/95",
            border: "border-[#FFA6C9]/40",
            text: "text-[#4a0e2e]",
            metaBg: "bg-[#FFA6C9]/20",
            metaText: "text-[#851853]"
          };
        case 1: // 노랑 (Yellow)
          return {
            bg: "bg-[#FFF9DB]/95",
            border: "border-[#FFE3A8]/40",
            text: "text-[#513a00]",
            metaBg: "bg-[#FFE3A8]/20",
            metaText: "text-[#8a6500]"
          };
        case 2: // 하늘색 (Sky Blue)
          return {
            bg: "bg-[#E3F2FD]/95",
            border: "border-[#90CAF9]/40",
            text: "text-[#0d274f]",
            metaBg: "bg-[#90CAF9]/20",
            metaText: "text-[#154694]"
          };
        case 3: // 연보라 (Lavender)
          return {
            bg: "bg-[#F3E5F5]/95",
            border: "border-[#CE93D8]/40",
            text: "text-[#320a45]",
            metaBg: "bg-[#CE93D8]/20",
            metaText: "text-[#621685]"
          };
        case 4: // 연두색 (Light Green)
          return {
            bg: "bg-[#E8F5E9]/95",
            border: "border-[#A5D6A7]/40",
            text: "text-[#052e16]",
            metaBg: "bg-[#A5D6A7]/20",
            metaText: "text-[#1b5e20]"
          };
        case 5: // 크림색 / 베이지 (Cream)
          return {
            bg: "bg-[#FFF3E0]/95",
            border: "border-[#FFCC80]/40",
            text: "text-[#451a03]",
            metaBg: "bg-[#FFCC80]/20",
            metaText: "text-[#823c00]"
          };
      }
    };

    // 6. CARD SPAWNING AND GEOGRAPHIC FENCE
    const addCard = (item, orderIdx) => {
      const theme = getCardThemeClass(orderIdx);
      
      const rect = mainArea.getBoundingClientRect();
      const cardWidth = 180;
      const cardHeight = 195;
      
      const marginX = 20;
      const marginY = 40;
      
      const maxX = rect.width - cardWidth - marginX * 2;
      const maxY = rect.height - cardHeight - marginY * 1.5;
      
      const px = Math.max(marginX, Math.random() * maxX + marginX);
      const py = Math.max(marginY, Math.random() * maxY + marginY);
      
      // Outer absolute layout
      const outerCard = document.createElement('div');
      outerCard.className = 'letter-card-outer absolute w-[180px] text-left transition-opacity duration-500 ease-in-out';
      outerCard.style.left = `${px}px`;
      outerCard.style.top = `${py}px`;

      // Inner float container
      const innerCard = document.createElement('div');
      innerCard.className = `letter-card-inner ${theme.bg} ${theme.border} ${theme.text} p-4 rounded-[20px] border shadow-xl shadow-sky-900/5 flex flex-col gap-2 relative`;
      
      const randomDelay = Math.random() * -3;
      innerCard.style.animationDelay = `${randomDelay}s`;

      innerCard.innerHTML = `
        <div class="flex items-center justify-between">
          <span class="text-3xl filter drop-shadow opacity-95">${item.emoji || '✏️'}</span>
          <span class="text-[10px] ${theme.metaBg} ${theme.metaText} px-2.5 py-0.5 rounded-full font-bold">${item.name || '익명'}</span>
        </div>
        <div class="text-xs ${theme.text} leading-relaxed line-clamp-5 max-h-[110px] overflow-y-auto break-all mt-1 font-medium whitespace-pre-wrap">` + 
          escapeHTML(item.message) + 
        `</div>
      `;

      outerCard.appendChild(innerCard);
      cardsContainer.appendChild(outerCard);

      // Max 15 floating envelopes
      const loadedCards = cardsContainer.querySelectorAll('.letter-card-outer');
      if (loadedCards.length > 15) {
        loadedCards[0].remove();
      }

      // Live 10000ms duration
      setTimeout(() => {
        outerCard.style.opacity = '0';
        setTimeout(() => {
          outerCard.remove();
        }, 500);
      }, 10000);
    };

    const escapeHTML = (text) => {
      if (!text) return "";
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    };

    // 7. HISTORIC SIDEBAR UPDATE (Shows newest 8 visible letters)
    const updateSidebar = (items) => {
      sidebarList.innerHTML = '';
      
      const visibleItems = items.filter(i => i.visible !== false);
      const latestEight = visibleItems.slice(-8).reverse();

      latestEight.forEach((item, idx) => {
        const row = document.createElement('div');
        row.className = 'sidebar-item-anim bg-white/40 border border-white/50 hover:bg-white/60 p-3 rounded-2xl flex items-start gap-2.5 transition-all outline-none';
        row.style.animationDelay = `${idx * 0.05}s`;

        row.innerHTML = `
          <div class="text-lg bg-white/60 p-1.5 rounded-xl shrink-0 shadow-sm">${item.emoji || '✏️'}</div>
          <div class="min-w-0 flex-1">
            <h4 class="text-xs font-bold text-sky-950 truncate">${item.name || '익명'}</h4>
            <p class="text-[10px] text-slate-600 mt-0.5 line-clamp-2 leading-relaxed break-all font-normal whitespace-pre-wrap">${escapeHTML(item.message)}</p>
          </div>
        `;
        sidebarList.appendChild(row);
      });
    };

    // 8. UPDATE BADGE ENGINE
    const updateBadge = (totalLength) => {
      totalBadge.innerText = totalLength;
      totalBadge.style.transform = 'scale(1.15)';
      setTimeout(() => {
        totalBadge.style.transform = 'scale(1)';
      }, 150);
    };

    // 9. COORD QUEUE FOR SEQUENTIAL CARRIER PIGEON ANIMATIONS
    const prevKeys = new Set();
    const flightQueue = [];
    let isFlightRunning = false;

    const processFlightQueue = () => {
      if (isFlightRunning || flightQueue.length === 0) return;

      isFlightRunning = true;
      const targetItem = flightQueue.shift();

      flyEnvelope(() => {
        addCard(targetItem, prevKeys.size);
        isFlightRunning = false;
        processFlightQueue();
      });
    };

    // 10. REALTIME FIREBASE RTDB SUBSCRIBER
    const lettersQuery = query(ref(db, 'letters'), orderByChild('timestamp'));
    onValue(lettersQuery, (snapshot) => {
      const data = snapshot.val();
      const currentEntries = [];

      if (data) {
        Object.keys(data).forEach(key => {
          const rawItem = data[key];
          if (rawItem.visible !== false) {
            currentEntries.push({ key, ...rawItem });
          }
        });
      }

      currentEntries.sort((a, b) => (a.timestamp || 0) - (b.timestamp || 0));

      const isInitialLoad = (prevKeys.size === 0);

      // Trigger Sidebars and Counters
      updateSidebar(currentEntries);
      updateBadge(currentEntries.length);

      if (isInitialLoad) {
        // Spontaneous render of last 3 board letters (fast, no anim block on startup)
        const initialCards = currentEntries.slice(-3);
        initialCards.forEach((item, idx) => {
          prevKeys.add(item.key);
          addCard(item, idx);
        });

        currentEntries.forEach(item => prevKeys.add(item.key));
      } else {
        // Catch dynamic additions
        currentEntries.forEach(item => {
          if (!prevKeys.has(item.key)) {
            prevKeys.add(item.key);
            
            // Queue mailing pigeon
            showNotification(item.name || '익명');
            flightQueue.push(item);
          }
        });

        processFlightQueue();
      }
    });
  </script>
</body>
</html>
