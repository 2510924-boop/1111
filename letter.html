<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>전서구 편지 보내기 🕊️</title>
  <!-- Google Fonts: Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Noto Sans KR', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    /* Floating Cloud Animation */
    @keyframes moveCloud {
      0% { transform: translateX(-150px); }
      100% { transform: translateX(calc(100vw + 150px)); }
    }
    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.45);
      border-radius: 100px;
      filter: blur(8px);
      pointer-events: none;
      animation: moveCloud linear infinite;
    }

    /* Carrier Pigeon Flapping Wings Loop */
    @keyframes flap {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-25deg); }
    }
    .wing-l {
      animation: flap 0.2s ease-in-out infinite;
      transform-origin: 32px 28px;
    }
    .wing-r {
      animation: flap 0.2s ease-in-out infinite reverse;
      transform-origin: 48px 28px;
    }

    /* Sending Takeoff Animation */
    @keyframes takeoff {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
      15% { transform: translate(-10px, 15px) scale(0.95); }
      100% { transform: translate(300px, -350px) scale(0.3) rotate(-15deg); opacity: 0; }
    }
    .takeoff-anim {
      animation: takeoff 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards !important;
    }

    /* Pop animation for success screen */
    @keyframes pop {
      0% { transform: scale(0); opacity: 0; }
      75% { transform: scale(1.15); opacity: 1; }
      100% { transform: scale(1); }
    }
    .pop-anim {
      animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* Scrollbar minimal customizer */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.02);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 3px;
    }
  </style>
</head>
<body class="bg-gradient-to-b from-[#87CEEB] to-[#A7D8FF] text-slate-800 min-h-screen flex items-center justify-center p-4 overflow-hidden relative font-sans">
  
  <!-- Back link to classroom billboard -->
  <div class="fixed top-4 left-4 z-20">
    <a href="index.html" class="flex items-center gap-2 px-4 py-2.5 bg-white/70 backdrop-blur-[12px] border border-white/60 text-sky-950 font-bold text-xs rounded-full shadow-lg transition-all hover:bg-white active:scale-95 shadow-sky-900/5 select-none">
      <span>📺</span>
      <span>교실 전광판 바로가기</span>
    </a>
  </div>

  <!-- Clouds drifting behind container -->
  <div id="cloud-container" class="absolute inset-0 z-0 pointer-events-none overflow-hidden"></div>

  <!-- Central Glassmorphism Card -->
  <div id="main-container" class="w-full max-w-[400px] bg-white/70 backdrop-blur-[16px] border border-white/40 rounded-[28px] p-6 md:p-8 shadow-2xl shadow-sky-900/10 relative z-10 transition-all duration-500">
    
    <!-- Write Form Container -->
    <div id="write-form-container">
      <!-- Title Header with Carrier Pigeon Mascot -->
      <div class="text-center mb-6">
        <!-- Cute Flapping 🕊️ SVG Icon -->
        <div class="inline-flex items-center justify-center w-16 h-16 bg-sky-500/10 rounded-2xl border border-white/60 mb-3 shadow-sm">
          <svg width="48" height="48" viewBox="0 0 80 80">
            <g fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <!-- Pigeon body & wing elements -->
              <path class="wing-l" d="M35,28 C25,12 18,22 35,28 Z" fill="#ffffff" />
              <path d="M30,38 C32,28 48,25 54,34 C58,40 50,46 45,46 C38,46 32,44 30,38 Z" fill="#ffffff" />
              <path class="wing-r" d="M45,28 C55,12 62,22 45,28 Z" fill="#ffffff" />
              <!-- Beak with tiny heart envelope -->
              <polygon points="54,34 59,32 55,38" fill="#f59e0b" stroke="#f59e0b" />
              <!-- Eye -->
              <circle cx="48" cy="32" r="1.5" fill="#2563eb" />
              <!-- Letter envelope watermarked -->
              <rect x="52" y="38" width="12" height="8" rx="1" fill="#ffffff" stroke="#2563eb" stroke-width="1.5" />
              <polyline points="52,38 58,42 64,38" stroke="#2563eb" stroke-dasharray="none" stroke-width="1" />
            </g>
          </svg>
        </div>
        <h1 class="text-xl md:text-2xl font-bold text-sky-950 tracking-tight leading-snug">전서구 편지 보내기</h1>
        <p class="text-xs text-slate-600 mt-1.5 leading-relaxed">전서구 비둘기에게 예쁜 마음의 편지를 쥐어주세요.<br/>교실 큰 전광판 화면에 배달해 드릴게요! 🕊️</p>
      </div>

      <!-- Main Input Form -->
      <form id="letter-form" class="space-y-4">
        <!-- Sender Name (Optional) -->
        <div>
          <label for="sender-name" class="block text-xs font-bold text-sky-950 mb-1.5 ml-0.5">보내는 이 <span class="text-sky-700/60 font-normal">(비워두면 익명)</span></label>
          <input 
            type="text" 
            id="sender-name" 
            maxlength="15"
            placeholder="이름을 입력하세요" 
            class="w-full bg-white/50 border border-white/60 rounded-xl px-4 py-2.5 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-500/10 transition-all font-medium"
          />
        </div>

        <!-- Message Content (Required) -->
        <div>
          <label for="letter-message" class="block text-xs font-bold text-sky-950 mb-1.5 ml-0.5">편지 내용 <span class="text-rose-500">*</span></label>
          <textarea 
            id="letter-message" 
            required
            rows="5"
            placeholder="하늘을 날아갈 따뜻한 메시지를 남겨보세요.&#10;욕설이나 부적절한 말은 자제해 주시는 센스! 😉" 
            class="w-full min-h-[120px] bg-white/50 border border-white/60 rounded-xl px-4 py-3 text-sm text-slate-800 placeholder-slate-400 focus:outline-none focus:border-sky-500 focus:bg-white focus:ring-2 focus:ring-sky-500/10 transition-all resize-none leading-relaxed font-normal"
          ></textarea>
        </div>

        <!-- Emoji Selector -->
        <div>
          <label class="block text-xs font-bold text-sky-950 mb-2 ml-0.5">편지지 마크</label>
          <div class="grid grid-cols-4 gap-2" id="emoji-grid">
            <button type="button" class="emoji-btn py-2 text-xl bg-white/40 hover:bg-white/60 border border-white/60 hover:border-white rounded-xl transition-all focus:outline-none flex items-center justify-center" data-emoji="✏️">✏️</button>
            <button type="button" class="emoji-btn py-2 text-xl bg-white/40 hover:bg-white/60 border border-white/60 hover:border-white rounded-xl transition-all focus:outline-none flex items-center justify-center" data-emoji="📚">📚</button>
            <button type="button" class="emoji-btn py-2 text-xl bg-white/40 hover:bg-white/60 border border-white/60 hover:border-white rounded-xl transition-all focus:outline-none flex items-center justify-center" data-emoji="🌟">🌟</button>
            <button type="button" class="emoji-btn py-2 text-xl bg-white/40 hover:bg-white/60 border border-white/60 hover:border-white rounded-xl transition-all focus:outline-none flex items-center justify-center" data-emoji="❤️">❤️</button>
            <button type="button" class="emoji-btn py-2 text-xl bg-white/40 hover:bg-white/60 border border-white/60 hover:border-white rounded-xl transition-all focus:outline-none flex items-center justify-center" data-emoji="😊">😊</button>
            <button type="button" class="emoji-btn py-2 text-xl bg-white/40 hover:bg-white/60 border border-white/60 hover:border-white rounded-xl transition-all focus:outline-none flex items-center justify-center" data-emoji="🎓">🎓</button>
            <button type="button" class="emoji-btn py-2 text-xl bg-white/40 hover:bg-white/60 border border-white/60 hover:border-white rounded-xl transition-all focus:outline-none flex items-center justify-center" data-emoji="🌈">🌈</button>
            <button type="button" class="emoji-btn py-2 text-xl bg-white/40 hover:bg-white/60 border border-white/60 hover:border-white rounded-xl transition-all focus:outline-none flex items-center justify-center" data-emoji="🙏">🙏</button>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="pt-2">
          <button 
            type="submit" 
            id="submit-btn"
            disabled
            class="w-full py-3.5 px-4 rounded-xl text-white font-bold text-sm transition-all focus:outline-none flex items-center justify-center gap-2 select-none shadow-lg bg-gradient-to-r from-sky-500 to-blue-600 shadow-sky-600/10 cursor-not-allowed opacity-50 active:scale-[0.982]"
          >
            <span id="btn-text">🕊️ 전서구 날려보내기</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Takeoff Animation Overlay (Hidden initially, appears over form) -->
    <div id="takeoff-overlay" class="hidden absolute inset-0 bg-white/80 backdrop-blur-[2px] rounded-[28px] flex flex-col items-center justify-center p-6 text-center z-20">
      <!-- Flapping dynamic SVG which will get the fly class -->
      <div id="pigeon-actor" class="w-24 h-24 transition-transform duration-100">
        <svg width="96" height="96" viewBox="0 0 80 80" class="w-full h-full">
          <g fill="none" stroke="#2563eb" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path class="wing-l" d="M35,28 C25,12 18,22 35,28 Z" fill="#ffffff" />
            <path d="M30,38 C32,28 48,25 54,34 C58,40 50,46 45,46 C38,46 32,44 30,38 Z" fill="#ffffff" />
            <path class="wing-r" d="M45,28 C55,12 62,22 45,28 Z" fill="#ffffff" />
            <polygon points="54,34 59,32 55,38" fill="#f59e0b" stroke="#f59e0b" />
            <circle cx="48" cy="32" r="1.5" fill="#2563eb" />
            <!-- Glowing letter in claws -->
            <rect x="36" y="44" width="14" height="10" rx="1.5" fill="#ffd6e7" stroke="#2563eb" stroke-width="1.5" />
            <polyline points="36,44 43,49 50,44" stroke="#2563eb" stroke-width="1" />
          </g>
        </svg>
      </div>
      <h3 class="text-sm font-semibold text-sky-950 mt-4 animate-pulse">전서구가 편지를 입에 물고 힘차게 도약하는 중...</h3>
    </div>

    <!-- Success View -->
    <div id="success-container" class="hidden text-center py-6">
      <div id="success-badge" class="inline-flex items-center justify-center w-20 h-20 bg-sky-500/10 border border-sky-300 rounded-full mb-6 shadow-xl shadow-sky-500/5 pop-anim">
        <svg width="48" height="48" viewBox="0 0 80 80">
          <g fill="none" stroke="#2563eb" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <!-- Stationary proud pigeon with branch/envelope -->
            <path d="M25,48 M28,30 C30,22 44,20 48,28 C52,34 46,39 42,39 C36,39 30,36 28,30 Z" fill="#ffffff" />
            <path d="M22,42 C24,36 34,36 38,44 C42,50 36,54 30,54 C24,54 22,48 22,42 Z" fill="#ffffff" />
            <polygon points="48,28 53,27 49,32" fill="#f59e0b" stroke="#f59e0b" />
            <!-- green leaf spray of hope -->
            <path d="M49,32 Q56,31 60,26" stroke="#10b981" stroke-width="2" />
            <circle cx="53" cy="29" r="1" fill="#10b981" />
            <circle cx="56" cy="30" r="1" fill="#10b981" />
            <circle cx="58" cy="27" r="1" fill="#10b981" />
          </g>
        </svg>
      </div>
      <h2 class="text-xl md:text-2xl font-bold text-sky-950 tracking-tight">전서구 출발 성공!</h2>
      <p class="text-sm text-slate-600 mt-3 leading-relaxed px-2">전서구가 편지를 완벽히 배달하러<br /><span class="font-bold text-blue-600">하늘 너머로 힘차게 날아갔어요!</span><br/>교실 대형 화면에서 확인해보세요!</p>
      
      <div class="mt-8 pt-4 border-t border-sky-200">
        <button 
          id="another-btn" 
          class="w-full py-3 bg-white/60 hover:bg-white/80 border border-slate-300/60 hover:border-slate-300 active:bg-white rounded-xl text-sky-950 font-bold text-sm transition-all focus:outline-none flex items-center justify-center gap-2 shadow-sm"
        >
          🕊️ 또 다른 편지 품어주기
        </button>
      </div>
    </div>

  </div>

  <!-- Firebase Integration via CDN Modules -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getDatabase, ref, push, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // Firebase configuration with provided keys
    const firebaseConfig = {
      apiKey: "AIzaSyCyfVIDGGqqpqO08mJ7dMsCsBYG2DWhd14",
      authDomain: "letter23-20f00.firebaseapp.com",
      databaseURL: "https://letter23-20f00-default-rtdb.firebaseio.com",
      projectId: "letter23-20f00",
      storageBucket: "letter23-20f00.firebasestorage.app",
      messagingSenderId: "280106321366",
      appId: "1:280106321366:web:6f23c4e8913ee683d25077",
      measurementId: "G-205J0TH5ZG"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // DOM Elements
    const form = document.getElementById('letter-form');
    const nameInput = document.getElementById('sender-name');
    const messageInput = document.getElementById('letter-message');
    const submitBtn = document.getElementById('submit-btn');
    const btnText = document.getElementById('btn-text');
    const cloudContainer = document.getElementById('cloud-container');
    
    // View containers
    const writeView = document.getElementById('write-form-container');
    const takeoffOverlay = document.getElementById('takeoff-overlay');
    const pigeonActor = document.getElementById('pigeon-actor');
    const successView = document.getElementById('success-container');
    const anotherBtn = document.getElementById('another-btn');

    // State Variables
    let selectedEmoji = '✏️';

    // 1. Generate horizontal clouds
    const makeDriftingClouds = () => {
      cloudContainer.innerHTML = '';
      for (let i = 0; i < 7; i++) {
        const cloud = document.createElement('div');
        cloud.className = 'cloud';
        
        // Random sizes and parameters
        const w = Math.random() * 80 + 100;
        const h = w * 0.45;
        cloud.style.width = `${w}px`;
        cloud.style.height = `${h}px`;
        
        cloud.style.top = `${Math.random() * 80}%`;
        
        // Stagger entrance starting left
        cloud.style.left = `-${w + 20}px`;
        
        const speed = Math.random() * 40 + 20; // 20s to 60s
        cloud.style.animationDuration = `${speed}s`;
        
        // Stagger first wave start times
        cloud.style.animationDelay = `${Math.random() * -30}s`;
        
        cloudContainer.appendChild(cloud);
      }
    };
    makeDriftingClouds();

    // 2. Setup Emoji Selection functionality
    const emojiBtns = document.querySelectorAll('.emoji-btn');
    const selectEmoji = (emoji) => {
      selectedEmoji = emoji;
      emojiBtns.forEach(btn => {
        const btnEmoji = btn.getAttribute('data-emoji');
        if (btnEmoji === emoji) {
          btn.classList.remove('bg-white/40', 'border-white/60', 'hover:border-white');
          btn.classList.add('bg-sky-500/20', 'border-sky-500/50', 'ring-2', 'ring-sky-500/20', 'scale-105');
        } else {
          btn.classList.remove('bg-sky-500/20', 'border-sky-500/50', 'ring-2', 'ring-sky-500/20', 'scale-105');
          btn.classList.add('bg-white/40', 'border-white/60', 'hover:border-white');
        }
      });
    };

    // Initialize Selection
    selectEmoji('✏️');

    emojiBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        selectEmoji(btn.getAttribute('data-emoji'));
      });
    });

    // 3. Monitor submit button state
    const updateSubmitState = () => {
      const isMessageEmpty = !messageInput.value.trim();
      submitBtn.disabled = isMessageEmpty;
      if (isMessageEmpty) {
        submitBtn.classList.add('cursor-not-allowed', 'opacity-50');
        submitBtn.classList.remove('hover:-translate-y-0.5', 'hover:shadow-sky-500/20', 'hover:opacity-95', 'active:scale-95');
      } else {
        submitBtn.classList.remove('cursor-not-allowed', 'opacity-50');
        submitBtn.classList.add('hover:-translate-y-0.5', 'hover:shadow-sky-500/20', 'hover:opacity-95', 'active:scale-95');
      }
    };
    messageInput.addEventListener('input', updateSubmitState);

    // 4. Form Submission and flight takeoff animation trigger
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const rawMessage = messageInput.value.trim();
      if (!rawMessage) return;

      const rawName = nameInput.value.trim();
      const displayName = rawName || '익명';

      // Lock buttons
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
      btnText.innerText = '전서구 출격 준비...';

      try {
        // Build post data payload first
        const lettersRef = ref(db, 'letters');
        const pushPromise = push(lettersRef, {
          name: displayName,
          message: rawMessage,
          emoji: selectedEmoji,
          timestamp: serverTimestamp(),
          visible: true
        });

        // Trigger takeoff sequence over 1.5 seconds!
        writeView.classList.add('pointer-events-none');
        takeoffOverlay.classList.remove('hidden');
        
        // Wait 200ms to trigger the actual flight takeoff style
        setTimeout(() => {
          pigeonActor.classList.add('takeoff-anim');
        }, 150);

        // Keep anim running for 1.6 seconds to let the bird fly away beautiful
        await Promise.all([
          pushPromise,
          new Promise(r => setTimeout(r, 1600))
        ]);

        // Finish sequence and transition
        transitionToSuccess();
      } catch (error) {
        console.error("Firebase push error:", error);
        alert("전송 실패했어요. 다시 시도해주세요.");
        
        // Re-enable form
        writeView.classList.remove('pointer-events-none');
        takeoffOverlay.classList.add('hidden');
        pigeonActor.classList.remove('takeoff-anim');
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
        btnText.innerText = '🕊️ 전서구 날려보내기';
      }
    });

    const transitionToSuccess = () => {
      // Hide form entirely and show success layout
      takeoffOverlay.classList.add('hidden');
      writeView.classList.add('hidden');
      writeView.classList.remove('pointer-events-none');
      
      successView.classList.remove('hidden');
    };

    anotherBtn.addEventListener('click', () => {
      // Clean controls
      form.reset();
      selectedEmoji = '✏️';
      selectEmoji('✏️');
      updateSubmitState();

      // UI restoration
      pigeonActor.classList.remove('takeoff-anim');
      successView.classList.add('hidden');
      writeView.classList.remove('hidden');
      
      // Refresh background clouds
      makeDriftingClouds();
    });
  </script>
</body>
</html>
